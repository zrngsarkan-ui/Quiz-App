    <style>
         :root {
            --bg1: #0f172a;
            --bg2: #1e3a8a;
            --card: rgba(255, 255, 255, 0.08);
            --stroke: rgba(255, 255, 255, 0.14);
            --green: #22c55e;
            --blue: #3b82f6;
            --purple: #a855f7;
            --red: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            background: linear-gradient(-45deg, #0f172a, #1d4ed8, #6d28d9, #111827);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
        }
        
        @keyframes bg {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .app {
            width: 100%;
            max-width: 850px;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 30px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
        }
        
        header {
            text-align: center;
        }
        
        header img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 25px;
        }
        
        h1 {
            margin-top: 15px;
            font-size: 32px;
        }
        
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .lang-switch button {
            flex: none;
            padding: 10px 20px;
        }
        
        .card {
            margin-top: 20px;
            padding: 22px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
        }
        
        .section {
            margin-bottom: 10px;
            opacity: .9;
        }
        
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        button {
            flex: 1;
            border: none;
            padding: 14px;
            border-radius: 18px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, #111827, #2563eb);
            transition: .3s;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 18px rgba(59, 130, 246, .5);
        }
        
        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, .15);
            transition: .4s;
        }
        
        button:hover::after {
            left: 100%;
        }
        
        .hidden {
            display: none;
        }
        
        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .progress {
            width: 100%;
            height: 10px;
            background: #111827;
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
            transition: width .5s ease;
        }
        
        #question {
            margin-bottom: 20px;
            font-size: 25px;
            line-height: 1.7;
        }
        
        .answer button {
            width: 100%;
            margin-top: 10px;
        }
        
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 15px;
            opacity: .9;
        }
        
        @media(max-width:600px) {
            header img {
                height: 180px;
            }
            h1 {
                font-size: 24px;
            }
            #question {
                font-size: 20px;
            }
            button {
                font-size: 13px;
            }
        }
        
        .theme-switch {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
        
        .light-mode {
            background: linear-gradient(-45deg, #f1f5f9, #dbeafe, #ede9fe, #ffffff);
            color: #111827;
        }
        
        .light-mode .app {
            background: rgba(255, 255, 255, .7);
            border: 1px solid rgba(0, 0, 0, .08);
            color: #111827;
        }
        
        .light-mode .card {
            background: rgba(255, 255, 255, .65);
            border: 1px solid rgba(0, 0, 0, .08);
        }
        
        .light-mode button {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: rgb(245, 0, 0);
        }
        
        .light-mode .progress {
            background: #d1d5db;
        }
        
        .light-mode #question {
            color: #111827;
        }
        
        .light-mode .footer {
            color: #111827;
        }
        /* 🧊 Glass Light Mode */
        
        .light-mode {
            background: linear-gradient( -45deg, #f8fafc, #dbeafe, #ede9fe, #ffffff);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
            color: #111827;
        }
        /* APP GLASS */
        
        .light-mode .app {
            background: rgba(255, 255, 255, .35);
            border: 1px solid rgba(255, 255, 255, .45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
            color: #111827;
        }
        /* CARD GLASS */
        
        .light-mode .card {
            background: rgba(255, 255, 255, .28);
            border: 1px solid rgba(255, 255, 255, .35);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }
        /* BUTTON GLASS */
        
        .light-mode button {
            background: linear-gradient( 135deg, rgba(96, 165, 250, .85), rgba(37, 99, 235, .9));
            border: 1px solid rgba(255, 255, 255, .25);
            box-shadow: 0 4px 18px rgba(59, 130, 246, .18);
            color: white;
        }
        /* BUTTON HOVER */
        
        .light-mode button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 24px rgba(59, 130, 246, .25);
        }
        /* QUESTION */
        
        .light-mode #question {
            color: #0f172a;
        }
        /* PROGRESS */
        
        .light-mode .progress,
        .light-mode .timer-wrap {
            background: rgba(255, 255, 255, .45);
            border: 1px solid rgba(255, 255, 255, .25);
        }
        /* FOOTER */
        
        .light-mode .footer {
            color: #0f172a;
            opacity: .8;
            /* ✨ Neon Dark Mode */
        }
        
        body {
            background: linear-gradient( -45deg, #020617, #0f172a, #1e1b4b, #111827);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
        }
        /* APP */
        
        .app {
            background: rgba(15, 23, 42, .55);
            border: 1px solid rgba(59, 130, 246, .25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 0 20px rgba(59, 130, 246, .18), 0 0 40px rgba(168, 85, 247, .12);
            color: white;
        }
        /* CARD */
        
        .card {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(59, 130, 246, .18);
            box-shadow: 0 0 18px rgba(59, 130, 246, .08);
        }
        /* TITLE */
        
        h1 {
            color: #fff;
            text-shadow: 0 0 8px #3b82f6, 0 0 18px #3b82f6, 0 0 30px #a855f7;
        }
        /* QUESTION */
        
        #question {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, .15);
        }
        /* BUTTON */
        
        button {
            background: linear-gradient( 135deg, rgba(30, 41, 59, .95), rgba(37, 99, 235, .9));
            border: 1px solid rgba(96, 165, 250, .35);
            box-shadow: 0 0 12px rgba(59, 130, 246, .25);
            color: white;
        }
        /* BUTTON HOVER */
        
        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 15px #3b82f6, 0 0 30px #3b82f6, 0 0 45px #a855f7;
        }
        /* SHINE EFFECT */
        
        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, .25), transparent);
            transition: .5s;
        }
        
        button:hover::after {
            left: 100%;
        }
        /* PROGRESS */
        
        .progress,
        .timer-wrap {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(59, 130, 246, .18);
        }
        /* PROGRESS BAR */
        
        .bar {
            background: linear-gradient( 90deg, #22c55e, #3b82f6, #a855f7);
            box-shadow: 0 0 12px #3b82f6, 0 0 24px #a855f7;
        }
        /* TIMER BAR */
        
        #timerBar {
            background: linear-gradient( 90deg, #22c55e, #eab308, #ef4444);
            box-shadow: 0 0 12px #ef4444;
        }
        /* FOOTER */
        
        .footer {
            color: white;
            opacity: .85;
            text-shadow: 0 0 10px rgba(255, 255, 255, .2);
        }
        
        .light-mode #timer {
            color: #111827 !important;
            text-shadow: none;
        }
        
        #score {
            padding: 6px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 0 12px rgba(59, 130, 246, .5);
            font-weight: 900;
        }
        
        #result {
            text-align: center;
            animation: pop .6s ease;
        }
        
        @keyframes pop {
            from {
                transform: scale(.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        #final {
            font-size: 18px;
            margin-top: 15px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 0 20px rgba(59, 130, 246, .2);
        }
        
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .question-card {
            transition: all 0.3s ease-in-out;
        }
        
        .hidden {
            display: none;
            opacity: 0;
        }
        
        .question-card {
            animation: slideIn .4s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

                        en: "What is Earth?"
                    },
                    a: {
                        ku: ["ئەستێرە", "خۆر", "مانگ", "هەسارە"],
                        en: ["Star", "Sun", "Moon", "Planet"]
                    },
                    c: 3



                }, {

                    q: {
                        ku: "ڕەنگی ئاسمان چییە؟",
                        en: "What is the color of the sky?"
                    },
                    a: {
                        ku: ["شین", "سور", "زەرد", "مۆر"],
                        en: ["Blue", "Red", "Yellow", "Purple"]
                    },
                    c: 0




                }],

                medium: [{

                    q: {
                        ku: "پایتەختی عێراق چییە؟",
                        en: "What is the capital of Iraq?"
                    },

                    a: {
                        ku: ["هەولێر", "بەغدا", "بەسرە", "موسڵ"],
                        en: ["Erbil", "Baghdad", "Basra", "Mosul"]
                    },

                    c: 1

                }, {

                    q: {
                        ku: "کەی ئەمریکا دۆخی خۆی دەستپێکرد؟",
                        en: "When did the USA declare its independence?"
                    },

                    a: {
                        ku: ["1804", "1492", "1620", "1776"],
                        en: ["1804", "1492", "1620", "1776"]
                    },

                    c: 3

                }, {

                    q: {
                        ku: "کەی جیهانەوە بەردەوام بوو؟",
                        en: "When did World War II end?"
                    },

                    a: {
                        ku: ["1945", "1918", "1939", "1965"],
                        en: ["1945", "1918", "1939", "1965"]
                    },

                    c: 0

                }, {
                    q: {
                        ku: "کەی شەڕی نێوان ئەڵمان و ئینگلیس لە نێوانیاندا ڕوویدا؟",
                        en: "When was the Battle of Britain?"
                    },

                    a: {
                        ku: ["1938", "1916", "1940", "1939"],
                        en: ["1938", "1916", "1940", "1939"]
                    },

                    c: 2


                }],

                hard: [{

                    q: {
                        ku: "گەورەترین ئۆقیانوس کامەیە؟",
                        en: "What is the largest ocean?"
                    },

                    a: {
                        ku: ["هیندی", "هێمن", "ئەتلەسی", "ئەرکتیکی"],
                        en: ["Indian", "Pacific", "Atlantic", "Arctic"]
                    },

                    c: 1

                }, {

                    q: {
                        ku: "کەی شەڕی نێوان ئەڵمان و روس لە نێوانیاندا ڕوویدا؟",
                        en: "When was the Battle of Stalingrad?"
                    },

                    a: {
                        ku: ["1942", "1916", "1939", "1945"],
                        en: ["1942", "1916", "1939", "1945"]
                    },

                    c: 0

                }, {

                    q: {
                        ku: "کەی شەڕی نێوان ئەڵمان و فەڕەنسا لە نێوانیاندا ڕوویدا؟",
                        en: "When was the Battle of Verdun?"
                    },

                    a: {
                        ku: ["1918", "1917", "1945", "1916"],
                        en: ["1918", "1917", "1945", "1916"]
                    },

                    c: 3

                }, {

                    q: {
                        ku: "کەی شەڕی نێوان ئەڵمان و سوڤیەت لە نێوانیاندا ڕوویدا؟",
                        en: "When was the Battle of Kursk?"
                    },

                    a: {
                        ku: ["1945", "1941", "1943", "1942"],
                        en: ["1945", "1941", "1943", "1942"]
                    },

                    c: 2

                }]
            }

        };

        let diff = "easy";
        let selected = [];
        let i = 0;
        let score = 0;
        let timer;

        function setLang(l) {

            lang = l;

            document.documentElement.lang = l;

            if (l === "ku") {
                document.documentElement.dir = "rtl";
            } else {
                document.documentElement.dir = "ltr";
            }

            document.getElementById("title")
                .innerText = text[l].title;

            document.getElementById("catText")
                .innerText = text[l].category;

            document.getElementById("diffText")
                .innerText = text[l].difficulty;

            document.getElementById("mathBtn")
                .innerText = text[l].math;

            document.getElementById("codeBtn")
                .innerText = text[l].code;

            document.getElementById("generalBtn")
                .innerText = text[l].general;

            document.getElementById("easyBtn")
                .innerText = text[l].easy;

            document.getElementById("mediumBtn")
                .innerText = text[l].medium;

            document.getElementById("hardBtn")
                .innerText = text[l].hard;

            document.getElementById("resultText")
                .innerText = text[l].result;

            document.getElementById("againBtn")
                .innerText = text[l].playAgain;

            localStorage.setItem("lang", l);
        }

        function setDiff(d) {
            diff = d;
        }

        function start(cat) {



            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
            selected = shuffle([...questions[cat][diff]]);

            i = 0;
            score = 0;

            document.getElementById("menu")
                .classList.add("hidden");

            document.getElementById("game")
                .classList.remove("hidden");

            document.getElementById("score")
                .innerText = score;

            show();
        }

        function show() {

            if (i >= selected.length) {
                end();
                return;
            }

            let q = selected[i];

            document.getElementById("question")
                .innerText = q.q[lang];


            document.getElementById("answers")
                .innerHTML = "";

            q.a[lang].forEach((ans, index) => {

                let btn =
                    document.createElement("button");

                btn.innerText = ans;

                btn.onclick = () => check(index);

                document.getElementById("answers")
                    .appendChild(btn);

            });

            startTimer();

            updateBar();

            let qEl = document.getElementById("question");

            qEl.classList.remove("question-card");

            void qEl.offsetWidth;

            qEl.classList.add("question-card");
        }

        function startTimer() {

            let s = 10;
            let width = 100;

            document.getElementById("timer").innerText = s;
            document.getElementById("timerBar").style.width = "100%";

            clearInterval(timer);

            timer = setInterval(() => {

                s--;
                width -= 10;

                document.getElementById("timer").innerText = s;
                document.getElementById("timerBar").style.width = width + "%";

                if (s <= 0) {
                    clearInterval(timer);
                    i++;
                    show();
                }

            }, 1000);
        }


        function check(x) {

            clearInterval(timer);

            let buttons =
                document.querySelectorAll("#answers button");

            buttons.forEach((btn, index) => {

                if (index === selected[i].c) {
                    btn.style.background = "green";
                }

                if (index === x &&
                    x !== selected[i].c) {

                    btn.style.background = "red";
                }

                btn.disabled = true;
            });

            if (x === selected[i].c) {
                score++;
            }

            document.getElementById("score")
                .innerText = score;

            setTimeout(() => {

                i++;

                show();

            }, 1000);
        }

        function updateBar() {

            document.getElementById("bar")
                .style.width =
                (i / selected.length) * 100 + "%";
        }

        function confetti() {
            const canvas = document.getElementById("confetti");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let pieces = [];

            for (let i = 0; i < 120; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 50,
                    color: `hsl(${Math.random()*360},100%,60%)`
                });
            }

            function draw() {

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                pieces.forEach(p => {

                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.r, p.r);

                    p.y += 2 + p.d * 0.05;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }
                });

                requestAnimationFrame(draw);
            }

            draw();
        }

        function end() {

            document.getElementById("game")
                .classList.add("hidden");

            document.getElementById("result")
                .classList.remove("hidden");

            let best =
                localStorage.getItem("best") || 0;



            if (score > best) {

                localStorage.setItem("best", score);

                best = score;
            }

            document.getElementById("final").innerHTML = `
    ⭐ ${score} / ${selected.length}
    <br><br>
    ${text[lang].bestScore}: ${best}
`;

            confetti();
        }

        let savedLang =
            localStorage.getItem("lang");

        if (savedLang) {
            setLang(savedLang);

        }

        function toggleTheme() {

            document.body.classList.toggle("light-mode");

            let btn =
                document.getElementById("themeBtn");

            if (document.body.classList.contains("light-mode")) {

                btn.innerText = "☀ Light Mode";

                localStorage.setItem("theme", "light");

            } else {

                btn.innerText = "🌙 Dark Mode";

                localStorage.setItem("theme", "dark");
            }
        }

        let savedTheme =
            localStorage.getItem("theme");

        if (savedTheme === "light") {

            document.body.classList.add("light-mode");

            document.getElementById("themeBtn")
                .innerText = "☀ Light Mode";
        }

        let highScore = localStorage.getItem("highScore") || 0;

        if (score > highScore) {
            localStorage.setItem("highScore", score);
        }


        document.getElementById("question")
            .classList.remove("question-card");

        void document.getElementById("question")
            .offsetWidth;


        let deferredPrompt;

        window.addEventListener("beforeinstallprompt", e => {

            e.preventDefault();

            deferredPrompt = e;

            document.getElementById("installBtn")
                .style.display = "block";
        });

        document.getElementById("installBtn")
            .addEventListener("click", async() => {

                if (!deferredPrompt) return;

                deferredPrompt.prompt();

                await deferredPrompt.userChoice;

                deferredPrompt = null;
            });


        if ("Notification" in window) {

            Notification.requestPermission()
                .then(permission => {

                    if (permission === "granted") {

                        new Notification(
                            "🎮 Quiz Pro", {
                                body: "بەخێربێیت بۆ یارییەکە!"
                            }
                        );
                    }
                });
        }




        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(reg => console.log("SW Registered"))
                    .catch(err => console.log(err));
            });
        }
    </script>
