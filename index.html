<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yari Prisar u Walam</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#22c55e">



    <meta name="theme-color" content="#2563eb">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
         :root {
            --bg1: #0f172a;
            --bg2: #1e3a8a;
            --card: rgba(255, 255, 255, 0.08);
            --stroke: rgba(255, 255, 255, 0.14);
            --green: #22c55e;
            --blue: #3b82f6;
            --purple: #a855f7;
            --red: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            background: linear-gradient(-45deg, #0f172a, #1d4ed8, #6d28d9, #111827);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
        }
        
        @keyframes bg {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .app {
            width: 100%;
            max-width: 850px;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 30px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
        }
        
        header {
            text-align: center;
        }
        
        header img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 25px;
        }
        
        h1 {
            margin-top: 15px;
            font-size: 32px;
        }
        
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .lang-switch button {
            flex: none;
            padding: 10px 20px;
        }
        
        .card {
            margin-top: 20px;
            padding: 22px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
        }
        
        .section {
            margin-bottom: 10px;
            opacity: .9;
        }
        
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        button {
            flex: 1;
            border: none;
            padding: 14px;
            border-radius: 18px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, #111827, #2563eb);
            transition: .3s;
            position: relative;
            overflow: hidden;
        }
        
        button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 18px rgba(59, 130, 246, .5);
        }
        
        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, .15);
            transition: .4s;
        }
        
        button:hover::after {
            left: 100%;
        }
        
        .hidden {
            display: none;
        }
        
        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }
        
        .progress {
            width: 100%;
            height: 10px;
            background: #111827;
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
            transition: width .5s ease;
        }
        
        #question {
            margin-bottom: 20px;
            font-size: 25px;
            line-height: 1.7;
        }
        
        .answer button {
            width: 100%;
            margin-top: 10px;
        }
        
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 15px;
            opacity: .9;
        }
        
        @media(max-width:600px) {
            header img {
                height: 180px;
            }
            h1 {
                font-size: 24px;
            }
            #question {
                font-size: 20px;
            }
            button {
                font-size: 13px;
            }
        }
        
        .theme-switch {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
        
        .light-mode {
            background: linear-gradient(-45deg, #f1f5f9, #dbeafe, #ede9fe, #ffffff);
            color: #111827;
        }
        
        .light-mode .app {
            background: rgba(255, 255, 255, .7);
            border: 1px solid rgba(0, 0, 0, .08);
            color: #111827;
        }
        
        .light-mode .card {
            background: rgba(255, 255, 255, .65);
            border: 1px solid rgba(0, 0, 0, .08);
        }
        
        .light-mode button {
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: rgb(245, 0, 0);
        }
        
        .light-mode .progress {
            background: #d1d5db;
        }
        
        .light-mode #question {
            color: #111827;
        }
        
        .light-mode .footer {
            color: #111827;
        }
        /* 🧊 Glass Light Mode */
        
        .light-mode {
            background: linear-gradient( -45deg, #f8fafc, #dbeafe, #ede9fe, #ffffff);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
            color: #111827;
        }
        /* APP GLASS */
        
        .light-mode .app {
            background: rgba(255, 255, 255, .35);
            border: 1px solid rgba(255, 255, 255, .45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
            color: #111827;
        }
        /* CARD GLASS */
        
        .light-mode .card {
            background: rgba(255, 255, 255, .28);
            border: 1px solid rgba(255, 255, 255, .35);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }
        /* BUTTON GLASS */
        
        .light-mode button {
            background: linear-gradient( 135deg, rgba(96, 165, 250, .85), rgba(37, 99, 235, .9));
            border: 1px solid rgba(255, 255, 255, .25);
            box-shadow: 0 4px 18px rgba(59, 130, 246, .18);
            color: white;
        }
        /* BUTTON HOVER */
        
        .light-mode button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 24px rgba(59, 130, 246, .25);
        }
        /* QUESTION */
        
        .light-mode #question {
            color: #0f172a;
        }
        /* PROGRESS */
        
        .light-mode .progress,
        .light-mode .timer-wrap {
            background: rgba(255, 255, 255, .45);
            border: 1px solid rgba(255, 255, 255, .25);
        }
        /* FOOTER */
        
        .light-mode .footer {
            color: #0f172a;
            opacity: .8;
            /* ✨ Neon Dark Mode */
        }
        
        body {
            background: linear-gradient( -45deg, #020617, #0f172a, #1e1b4b, #111827);
            background-size: 400% 400%;
            animation: bg 12s ease infinite;
        }
        /* APP */
        
        .app {
            background: rgba(15, 23, 42, .55);
            border: 1px solid rgba(59, 130, 246, .25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 0 20px rgba(59, 130, 246, .18), 0 0 40px rgba(168, 85, 247, .12);
            color: white;
        }
        /* CARD */
        
        .card {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(59, 130, 246, .18);
            box-shadow: 0 0 18px rgba(59, 130, 246, .08);
        }
        /* TITLE */
        
        h1 {
            color: #fff;
            text-shadow: 0 0 8px #3b82f6, 0 0 18px #3b82f6, 0 0 30px #a855f7;
        }
        /* QUESTION */
        
        #question {
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, .15);
        }
        /* BUTTON */
        
        button {
            background: linear-gradient( 135deg, rgba(30, 41, 59, .95), rgba(37, 99, 235, .9));
            border: 1px solid rgba(96, 165, 250, .35);
            box-shadow: 0 0 12px rgba(59, 130, 246, .25);
            color: white;
        }
        /* BUTTON HOVER */
        
        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 15px #3b82f6, 0 0 30px #3b82f6, 0 0 45px #a855f7;
        }
        /* SHINE EFFECT */
        
        button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, .25), transparent);
            transition: .5s;
        }
        
        button:hover::after {
            left: 100%;
        }
        /* PROGRESS */
        
        .progress,
        .timer-wrap {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(59, 130, 246, .18);
        }
        /* PROGRESS BAR */
        
        .bar {
            background: linear-gradient( 90deg, #22c55e, #3b82f6, #a855f7);
            box-shadow: 0 0 12px #3b82f6, 0 0 24px #a855f7;
        }
        /* TIMER BAR */
        
        #timerBar {
            background: linear-gradient( 90deg, #22c55e, #eab308, #ef4444);
            box-shadow: 0 0 12px #ef4444;
        }
        /* FOOTER */
        
        .footer {
            color: white;
            opacity: .85;
            text-shadow: 0 0 10px rgba(255, 255, 255, .2);
        }
        
        .light-mode #timer {
            color: #111827 !important;
            text-shadow: none;
        }
        
        #score {
            padding: 6px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 0 12px rgba(59, 130, 246, .5);
            font-weight: 900;
        }
        
        #result {
            text-align: center;
            animation: pop .6s ease;
        }
        
        @keyframes pop {
            from {
                transform: scale(.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        #final {
            font-size: 18px;
            margin-top: 15px;
            padding: 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 0 20px rgba(59, 130, 246, .2);
        }
        
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .question-card {
            transition: all 0.3s ease-in-out;
        }
        
        .hidden {
            display: none;
            opacity: 0;
        }
        
        .question-card {
            animation: slideIn .4s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>
<canvas id="confetti"></canvas>

<body>

    <div class="app">

        <header>

            <img src="https://cdn.hcmb.app/epicplay-assets/trivia-quiz-game-online-og.jpg">

            <h1 id="title">⚡ یاری پرسیار و وەڵام</h1>

            <div class="lang-switch">
                <button onclick="setLang('ku')">🇹🇯 کوردی</button>
                <button onclick="setLang('en')">🇺🇸 English</button>
                <button onclick="shareScore()">
📤 Share Score
</button>
                <button onclick="installApp()">
📲 Install App
</button>
                <button id="installBtn" style="display:none">
📲 Install App
</button>
            </div>



            <div class="theme-switch">
                <button onclick="toggleTheme()" id="themeBtn">
        🌙 Dark Mode
    </button>
            </div>
        </header>

        <div id="menu" class="card">

            <div class="section" id="catText">📚 بەش</div>

            <div class="row">
                <button id="mathBtn" onclick="start('math')">
                    📐 بیرکاری
                </button>

                <button id="codeBtn" onclick="start('programming')">
                    💻 کۆد
                </button>

                <button id="generalBtn" onclick="start('general')">
                    🌍 گشتی
                </button>
            </div>

            <div class="section" id="diffText">🎚 ئاست</div>

            <div class="row">
                <button id="easyBtn" onclick="setDiff('easy')">
                    🟢 ئاسان
                </button>

                <button id="mediumBtn" onclick="setDiff('medium')">
                    🟡 مامناوەند
                </button>

                <button id="hardBtn" onclick="setDiff('hard')">
                    🔴 سەخت
                </button>
            </div>

        </div>

        <div id="game" class="card hidden">



            <div class="top">

                <div>
                    ⏱ <span id="timer">10</span>s
                </div>

                <div>
                    ⭐ <span id="score">0</span>
                </div>

            </div>
            <div class="progress timer-wrap">
                <div class="bar" id="timerBar"></div>
            </div>

            <div class="progress">
                <div class="bar" id="bar"></div>
            </div>

            <h2 id="question"></h2>

            <div id="answers" class="answer"></div>

        </div>

        <div id="result" class="card hidden">


            <h2 id="resultText">🏆 ئەنجام</h2>


            <p id="final"></p>
            <p id="bestScore"></p>

            <button id="againBtn" onclick="location.reload()">
               
    ...
   

                🔄 دووبارە یاری بکە

            </button>

        </div>

        <div class="footer">
            ✨ (Zrng Sarkan Ghafur)دروست کراوە لە لایەن
        </div>

    </div>

    <script src="script.js"></script>


</body>

</html>
